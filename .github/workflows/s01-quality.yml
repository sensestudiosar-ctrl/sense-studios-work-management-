name: S01 quality

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      E2E_NAS_ROOT: /tmp/sense-s01-e2e-nas
      S18_SCREENSHOT_DIR: .env.s18-tools/runs/${{ github.run_id }}-${{ github.run_attempt }}/screenshots
      DATABASE_URL: postgresql://sense_app_runtime:ci-only-app-password@127.0.0.1:56433/sense_s13_ci_test
      MIGRATION_DATABASE_URL: postgresql://sense_s01:ci-only-password@127.0.0.1:56433/sense_s13_ci_test
      S01_DB_USER: sense_s01
      S01_DB_NAME: sense_s01_test
      S01_DB_PASSWORD: ci-only-password
      S01_DB_PORT: "55432"
      S01_DATABASE_URL: postgresql://sense_s01:ci-only-password@db:5432/sense_s01_test
      S04_APP_DB_PASSWORD: ci-only-app-password
      S01_APP_DATABASE_URL: postgresql://sense_app_runtime:ci-only-app-password@db:5432/sense_s01_test
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_USER: sense_s01
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sense_s13_ci_test
        ports:
          - 56433:5432
        options: >-
          --health-cmd "pg_isready -U sense_s01 -d sense_s13_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # pnpm11 requires Node>=22.13; runner defaults may still be Node20.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:nas
      - run: node --test scripts/ci/fixture-process.test.mjs scripts/ci/browser-progress.test.mjs
      - run: pnpm nas:check:compose
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - name: Set the restricted test runtime password
        run: |
          psql "$MIGRATION_DATABASE_URL" --set=app_password="$S04_APP_DB_PASSWORD" <<'SQL'
          ALTER ROLE sense_app_runtime PASSWORD :'app_password';
          SQL
      - name: Provision isolated PostgreSQL fixtures for every guarded suite
        run: node scripts/ci/prepare-disposable-postgres.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run API, PostgreSQL, and web suites with no-skips acceptance
        run: node scripts/ci/run-api-web-tests.mjs
      - run: pnpm build
        env:
          NODE_ENV: production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nas:check:phones
      - run: mkdir -p "$E2E_NAS_ROOT"
      - name: Run browser suites with loopback accounting receiver and no-skips acceptance
        timeout-minutes: 30
        run: node scripts/ci/run-e2e.mjs
      - name: Upload structured test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/${{ github.run_id }}-${{ github.run_attempt }}
            test-results/
          if-no-files-found: warn
      - name: Container and recovery rehearsal
        run: |
          docker compose -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.yaml up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
          node scripts/rehearse-backup.mjs
      - name: Stop test containers
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes --remove-orphans
      - name: Stop disposable PostgreSQL fixtures
        if: always()
        run: node scripts/ci/cleanup-disposable-postgres.mjs
