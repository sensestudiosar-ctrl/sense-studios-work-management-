# This image has no published host port. Only cloudflared joins its ingress network.
map $http_cf_connecting_ip $sense_client_ip {
  "" $remote_addr;
  default $http_cf_connecting_ip;
}
server {
  listen 8080;
  server_name _;
  set $sense_public_scheme https;
  set $sense_hsts "max-age=31536000";
  include /etc/nginx/sense/routes.conf;
}
