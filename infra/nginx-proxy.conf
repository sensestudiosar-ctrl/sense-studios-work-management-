set $sense_api http://api:4000;
proxy_pass $sense_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
# These are selected by the server config, never forwarded verbatim from clients.
proxy_set_header X-Forwarded-For $sense_client_ip;
proxy_set_header X-Forwarded-Proto $sense_public_scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_request_buffering off;
proxy_buffering off;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
include /etc/nginx/sense/headers.conf;
