root /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;
client_body_timeout 120s;
send_timeout 120s;
server_tokens off;
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 "ready\n";
}

location = /api/docs { return 404; }
location ^~ /api/docs/ { return 404; }

# DOC and EXTERNAL controllers still enforce binary MIME, checksum and exact size.
location ~ ^/api/v1/(documents|external-portal)/uploads/[0-9a-fA-F-]+/chunks/[0-9]+$ {
  client_max_body_size 8m;
  include /etc/nginx/sense/proxy.conf;
}
location = /api/v1/workforce/attendance/check-in {
  client_max_body_size 6m;
  include /etc/nginx/sense/proxy.conf;
}
location ~ ^/api/v1/portfolio/projects(?:/|$) {
  client_max_body_size 12m;
  include /etc/nginx/sense/proxy.conf;
}
location /api/ {
  include /etc/nginx/sense/proxy.conf;
}

# The service worker and navigation shell must discover new releases promptly.
location = /sw.js {
  try_files $uri =404;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  include /etc/nginx/sense/headers.conf;
}
location = /manifest.webmanifest {
  try_files $uri =404;
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/sense/headers.conf;
}
location = /index.html {
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/sense/headers.conf;
}
location ~ ^/assets/.+\.mjs$ {
  default_type application/javascript;
  try_files $uri @previous_release_module;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/sense/headers.conf;
}
location @previous_release_module {
  root /srv/sense/static-history;
  default_type application/javascript;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/sense/headers.conf;
}
location /assets/ {
  try_files $uri @previous_release_asset;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/sense/headers.conf;
}
location @previous_release_asset {
  root /srv/sense/static-history;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/sense/headers.conf;
}
location / {
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/sense/headers.conf;
  try_files $uri $uri/ /index.html;
}
